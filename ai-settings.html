<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; font: 12px Arial, sans-serif; color: #334155; }
        label { display: block; margin: 7px 0; }
        input[type=password], input[type=text], select { box-sizing: border-box; width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { padding: 5px 10px; cursor: pointer; }
        p { margin: 7px 0; line-height: 1.35; }
    </style>
</head>
<body>
    <label for="key"><strong>Gemini API key</strong></label>
    <input id="key" type="password" autocomplete="off" placeholder="Enter an API key">
    <label><input id="clear" type="checkbox"> Remove saved key</label>
    <label><input id="enabled" type="checkbox"> Use AI for short-answer and fill-in questions</label>
    <label for="model"><strong>Gemini model</strong></label>
    <select id="model">
        <option value="gemini-flash-latest">Flash latest — free tier, follows the newest Flash model (recommended)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash — free tier, stronger reasoning</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash — free tier</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite — free tier, fastest / least capable</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite — free tier</option>
        <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview — paid API / no typical free-tier quota</option>
        <option value="gemini-pro-latest">Pro latest alias — access and billing vary; usually paid or plan-restricted</option>
        <option value="custom">Custom model ID or alias…</option>
    </select>
    <input id="custom-model" type="text" autocomplete="off" placeholder="e.g. gemini-3.8-flash" style="display:none;margin-top:6px">
    <p>Flash and Flash-Lite options above are listed as free-tier models in Google’s current pricing. Pro options generally require billing or an eligible plan. Aliases can change over time; explicit model IDs are more predictable.</p>
    <p>Question text and images are sent to Google. Answers may be wrong.</p>
    <button id="save" type="button">Save AI Settings</button> <span id="status" role="status"></span>
    <script src="ai-settings.js"></script>
</body>
</html>
